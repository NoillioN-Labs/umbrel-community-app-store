releaseNotes: >-
  Version 0.6.3 focuses on clearer performance insight and simpler miner setup.
  Worker fleet now shows a rolling 24-hour average and places Last Block Found
  beside Current hashrate. Overview adds average hashrate and focused 1h, 6h,
  24h and 7d ranges; Analytics adds 30d and 6m views plus five recent rewards
  with effort. Peer versions are cleaner, Kaspa P2P uses standard TCP 16111,
  and ASIC setup uses a familiar Pool Address / Wallet-Worker / Password layout.
  Miner Stratum now uses TCP 5556—update every miner pool address after upgrading.

