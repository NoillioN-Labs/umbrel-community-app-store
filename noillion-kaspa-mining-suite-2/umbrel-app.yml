releaseNotes: >-
  Standardizes Kaspa P2P on TCP 16111. Before upgrading, stop any other app using 16111; update router forwarding to external TCP 16111 -> Umbrel TCP 16111. Upgrade briefly restarts mining services and preserves existing data. Adds Overview 1h/6h/24h/7d periods and average hashrate, Analytics 30d/6m periods, five recent rewards with effort, simplified peer versions and ASIC connection guidance.
