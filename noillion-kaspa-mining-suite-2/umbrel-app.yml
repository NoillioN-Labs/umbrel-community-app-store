releaseNotes: >-
  Version 0.6.5 improves mobile use on iPhone and other touch devices. Analytics
  now stays within the screen at normal zoom, controls use reliable touch areas,
  and the navigation and block celebration respond to one tap. The celebration
  also includes a Disable future pop-ups option linked to the existing Settings
  preference. Application version reporting now comes directly from the package
  release and is checked automatically before publication.

