releaseNotes: >-
  Version 0.8.0 removes the Pilot label and clarifies optional merged mining
  and Kaspa-only operation. Fixes Overview history to include both reporting
  sources, with the average centred below the chart. New fleet history starts
  after updating; prior merged-mining history is not reconstructed.
  Analytics shows saved KAS and ZKAS discoveries separately from Kaspa-only
  bridge rewards and estimates. Merged-mining rewards remain unverified.
  Connection help now shows the selected mining endpoint and required address
  pair. IN badges are purple and OUT badges teal in both themes.
  Discoveries are captured by polling: a gateway crash before observation can
  lose an entry. Delivered-job counts remain session observations.
  Download a database backup before updating. This release upgrades the database
  schema; rollback to an older runtime requires a compatible pre-update backup.
  Update through this community store, not by uninstalling. Mining briefly
  restarts; existing addresses, data paths, ports and ownership hooks remain.
  No miner is redirected automatically. The app never holds wallet keys.

