submission: ""
dependencies: []
path: ""
releaseNotes: >-
  Version 0.6.6 adds an optional daily Stratum Bridge restart schedule for
  operators who power ASICs around solar-production hours. Choose a local time
  and named time zone in Settings; daylight-saving changes are handled
  automatically. At the scheduled minute, only the supervised bridge restarts
  and is health-checked. The Kaspa node and dashboard remain running, historical
  data is preserved, and the trigger and result are recorded in diagnostics.

