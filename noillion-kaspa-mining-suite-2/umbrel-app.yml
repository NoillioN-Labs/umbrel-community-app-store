id: noillion-kaspa-mining-suite-2
name: Kaspa Mining Suite 2.0
tagline: Your node, your miners, a live view of Kaspa
icon: https://raw.githubusercontent.com/NoillioN-Labs/umbrel-community-app-store/main/noillion-kaspa-mining-suite-2/icon.svg
category: crypto
version: "0.8.2"
port: 5560
description: >-
  Optional KAS + ZKAS merged mining. Configure one owner's public Kaspa and ZKAS
  Orchard receive addresses in Settings before using the optional TCP 5558
  endpoint. It starts disabled, falls back to Kaspa when ZKAS is unavailable,
  and protects configuration changes with the app password displayed by Umbrel.
  It never holds wallet keys. The separate ZKAS node begins syncing after
  installation. Observed merged-mining discoveries are stored across restarts, with
  separate node-visibility checks. Visibility does not verify rewards.
  Kaspa analytics includes discoveries and node-resolved rewards from both mining
  modes. ZKAS discoveries are shown separately; ZKAS rewards remain unverified.
  Celebrations cover the Kaspa-only bridge. For Kaspa-only
  mining, leave merged mining disabled and connect ASICs to TCP 5556 using a
  public KAS address and worker name. Disabling merged mining closes TCP 5558;
  ASICs must be moved to TCP 5556 manually. Saved addresses and discoveries remain.


  Turn your Umbrel into a complete Kaspa solo-mining command centre. Kaspa
  Mining Suite 2.0 brings your dedicated Kaspa node, official Stratum bridge,
  ASIC worker telemetry, live GhostDAG, hashrate history and verified reward
  analytics into one responsive dashboard. Compare current and 24-hour worker
  performance, track shares and discoveries, inspect peers and synchronization,
  and see exact node-resolved rewards without sending mining data to a
  third-party pool. ASICs connect over your local network on Stratum TCP 5556;
  Kaspa P2P uses standard TCP 16111. The app is non-custodial: your payout
  address remains in miner configuration and the suite never holds wallet keys
  or funds.
developer: NoillioN Labs
