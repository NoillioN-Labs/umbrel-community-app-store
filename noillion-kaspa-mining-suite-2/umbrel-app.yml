dependencies: []
path: ""
deterministicPassword: true
releaseNotes: >-
  Experimental 0.7.0-pilot.1 adds an opt-in KAS/ZKAS solo gateway on TCP 5557,
  one-owner public address configuration with native checksum validation,
  automatic Kaspa fallback and separate chain-tagged session discoveries.
  Pilot settings require the app password displayed by Umbrel; the dashboard
  remains password-free behind Umbrel's access controls.
  Kaspa-only TCP 5556, UI 5560 and existing data paths are unchanged. The new
  ZKAS node syncs into its own directory; allow additional RAM and disk space.
  Startup hooks create and repair non-root data ownership before services run.
  This is a real-world test release, not proof of ASIC compatibility or payouts.
  Pilot discoveries are not yet in the durable reward ledger. Never enter keys
  or seed phrases. No miner is redirected automatically.

