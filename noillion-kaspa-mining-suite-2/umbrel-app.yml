path: ""
deterministicPassword: true
releaseNotes: >-
  Version 0.8.1 fixes analytics for merged mining. Overview now shows separate
  KAS and ZKAS discoveries in the last 24 hours. Kaspa reward analytics includes
  both mining modes, counts each hash once and automatically checks saved merged
  KAS discoveries with the local node. The Kaspa outlook includes fresh merged
  hashrate. Analytics adds period-based KAS and ZKAS cards and discovery filtering.
  Unresolved rewards are distinguished from zero rewards. Long-period charts
  include the complete saved ledger. ZKAS rewards remain unverified; node
  visibility and block rewards do not establish spendable wallet credit.
  Saved historical hashes can be checked, but missed or session-only discoveries
  cannot be reconstructed and some historical node queries may remain unresolved.
  Download a database backup before updating. Schema 8, existing data paths,
  addresses, ports and ownership hooks are preserved. Update through this store
  without uninstalling. Mining services briefly restart during the update.


