name: Kaspa Mining Suite 2.0
tagline: Your node, your miners, a live view of Kaspa
icon: https://raw.githubusercontent.com/NoillioN-Labs/umbrel-community-app-store/main/noillion-kaspa-mining-suite-2/icon.svg
