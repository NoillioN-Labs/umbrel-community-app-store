description: >-
  Development preview with a dedicated Kaspa node, supervised official Stratum
  bridge, durable mining ledger, worker telemetry and a live GhostDAG.
  Uses Stratum port 55556 and standard Kaspa P2P port 16111.
  Physical Umbrel and IceRiver KS0 Ultra / KS7 Lite acceptance is pending.
  A synchronized node is required before mining. Wallet keys never belong here.
