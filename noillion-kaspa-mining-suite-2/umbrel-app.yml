path: ""
releaseNotes: >-
  Version 0.6.8 upgrades both the Kaspa node and official Stratum Bridge to
  Rusty Kaspa 2.1.0. The release adds P2P protocol 11 with backwards-compatible
  chunked initial sync, stronger network and arithmetic safety checks, and
  important bridge fixes for dashboard path traversal, lingering CLOSE_WAIT
  sockets and unbounded mining metrics. The navigation footer now reports node
  and bridge version 2.1.0 and application version 0.6.8.

