submitter: NoillioN Labs
submission: ""
dependencies: []
path: ""
releaseNotes: >-
  Version 0.6.4 improves Analytics readability and accessibility in both themes.
  Reward subsidy, accepted fees and DAG merge values now use distinct semantic
  colours selected for dark and light backgrounds. Blue and Red block outcomes
  are shown in literal blue and red across charts, timelines and status chips,
  while warning and effort colours remain readable in daylight and dark mode.
  The application shell, official Kaspa branding, ports and mining behaviour are
  unchanged.

