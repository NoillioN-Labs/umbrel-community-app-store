deterministicPassword: true
releaseNotes: >-
  Version 0.8.2 updates the ZKAS node and merged gateway for the mandatory
  ZKAS security fork and its bound merge-mining proofs. It fixes worker telemetry
  disappearing after 10,000 recorded discoveries and calculates merged hashrate
  from recent accepted work instead of the worker's lifetime average.
  Missing merged telemetry is shown as unavailable; incomplete fleet data no
  longer produces a misleading Kaspa forecast. Difficulty and rejected-share
  reporting are corrected. ZKAS rewards remain unverified and are not wallet credit.
  Existing discovery history, payout addresses, mining ports and database schema 8
  are preserved. Historical hashrate samples are retained and cannot be recalculated.
  Download a database backup before updating in place without uninstalling.
  Mining services briefly restart during the update; ZKAS may need to catch up
  with its network before merged work resumes.

