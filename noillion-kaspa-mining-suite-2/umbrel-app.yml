releaseNotes: >-
  Version 0.6.7 calculates hashrate from accepted share work over a rolling
  five-minute window, preventing idle time from creating a misleading slow
  ramp. Automatic Stratum recovery replaces the daily restart: a newly
  connected miner that submits no shares for three minutes receives one
  bridge-only recovery attempt with a 30-minute cooldown. Kaspad remains
  running. This release also reduces duplicate disconnect logs, corrects event
  severity and removes encoded connection payloads from diagnostic exports.

