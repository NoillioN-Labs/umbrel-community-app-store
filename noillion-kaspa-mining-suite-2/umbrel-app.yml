submission: ""
dependencies: []
path: ""
deterministicPassword: true
releaseNotes: >-
  Adds pilot work diagnostics to Settings: successfully sent merged and
  Kaspa-only jobs, recent delivered work mode, ZKAS template readiness and
  age, and fallback reasons. Stale or missing diagnostics show unavailable
  rather than a current success state. Template readiness is separate from
  work actually sent to a miner; neither proves a block or payout.
  Miner connection details now explicitly show the public Kaspa address used
  as the pool password, separate from the Umbrel configuration password.
  Update through this community store; do not uninstall or delete app data.
  Pilot TCP 5558, Kaspa-only TCP 5556, UI 5560, service identities, non-root
  ownership hooks and all persisted data paths are unchanged.
  The pilot remains experimental. Counts reset with gateway sessions;
  discoveries are not yet in the durable reward ledger. No miner is redirected
  automatically, and the app never holds wallet keys or seed phrases.

