version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: noillion-kaspa-mining-suite-2_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/noillion-labs/kaspa-mining-suit-2-community-app:36c83857d07ccd538bd4393fe5823ad845e6f687@sha256:c26a210b24e52da760ecd42f7288a0918c6d7ebdaeade34c63b0c36d7969c2df
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      # Dashboard is password-free; pilot configuration still requires APP_PASSWORD.
      SUITE_AUTH_REQUIRED: "false"
      SUITE_PASSWORD: "${APP_PASSWORD}"
      KASPAD_ADDRESS: noillion-kaspa-mining-suite-2_node_1:16110
      NODE_LOG_DIR: /node-logs
      MERGED_GATEWAY_BINARY: /usr/local/bin/merged-stratum-bridge
      PILOT_DATA_DIR: /pilot
      ZKAS_NODE_ADDRESS: noillion-kaspa-mining-suite-2_zkas_1:16110
      MERGED_STRATUM_PUBLIC_PORT: "${APP_KASPA_SUITE_MERGED_STRATUM_PORT}"
      STRATUM_PUBLIC_PORT: "${APP_KASPA_SUITE_STRATUM_PORT}"
      UMBREL_HOST: "${APP_KASPA_SUITE_LAN_HOST}"
    ports:
      - "${APP_KASPA_SUITE_STRATUM_PORT}:5555"
      - "${APP_KASPA_SUITE_MERGED_STRATUM_PORT}:5557"
    volumes:
      - ${APP_DATA_DIR}/data/suite:/data
      - ${APP_DATA_DIR}/data/node-logs:/node-logs:ro
      - ${APP_DATA_DIR}/data/pilot:/pilot
    depends_on:
      - node
      - zkas
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  node:
    image: ghcr.io/noillion-labs/kaspa-mining-suit-2-community-app:36c83857d07ccd538bd4393fe5823ad845e6f687@sha256:c26a210b24e52da760ecd42f7288a0918c6d7ebdaeade34c63b0c36d7969c2df
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 2m
    command:
      [
        "kaspad",
        "--appdir=/data",
        "--logdir=/node-logs",
        "--rpclisten=0.0.0.0:16110",
        "--listen=0.0.0.0:16111",
        "--utxoindex",
        "--disable-upnp",
      ]
    ports:
      - "16111:16111"
    volumes:
      - ${APP_DATA_DIR}/data/node:/data
      - ${APP_DATA_DIR}/data/node-logs:/node-logs
  zkas:
    image: ghcr.io/noillion-labs/kaspa-mining-suit-2-community-app:36c83857d07ccd538bd4393fe5823ad845e6f687@sha256:c26a210b24e52da760ecd42f7288a0918c6d7ebdaeade34c63b0c36d7969c2df
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 2m
    mem_limit: 4g
    command:
      [
        "zkas-kaspad",
        "--appdir=/data",
        "--logdir=/node-logs",
        "--rpclisten=0.0.0.0:16110",
        "--listen=0.0.0.0:16111",
        "--utxoindex",
        "--disable-upnp",
        "--ram-scale=0.3",
        "--outpeers=8",
        "--maxinpeers=8",
      ]
    volumes:
      - ${APP_DATA_DIR}/data/zkas-node:/data
      - ${APP_DATA_DIR}/data/zkas-logs:/node-logs
