name: Publish Hash Power Pro container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "noillion-hash-power-pro/Dockerfile"
      - "noillion-hash-power-pro/src/**"
      - ".github/workflows/hash-power-pro-container.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out app store
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ./noillion-hash-power-pro
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noillion-labs/hash-power-pro:0.1.3
            ghcr.io/noillion-labs/hash-power-pro:latest
          provenance: true
          sbom: true
