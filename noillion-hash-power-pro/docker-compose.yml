version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: noillion-hash-power-pro_server_1
      APP_PORT: 5558

  server:
    image: ghcr.io/noillion-labs/hash-power-pro:0.1.7@sha256:50bf0d6da84b946dd0ff8c8ba4103f8e4e3c7c04e4cdce150af3d1d825aec010
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    environment:
      STRATUM_LISTEN_HOST: 0.0.0.0
      STRATUM_LISTEN_PORT: 5557
      CONTROL_LISTEN_HOST: 0.0.0.0
      CONTROL_LISTEN_PORT: 5558
      CONTROL_TOKEN: "${APP_PASSWORD}"
      GATEWAY_IDENTITY_PATH: /data/gateway-identity.json
      OWNER_UPSTREAM_HOST: host.docker.internal
      OWNER_UPSTREAM_PORT: 5556
      RENTER_UPSTREAM_HOST: au.kaspa.herominers.com
      RENTER_UPSTREAM_PORT: 1208
      ICP_LEASE_OBSERVER_ENABLED: "true"
      ICP_LEASE_ENFORCEMENT_ENABLED: "false"
      ICP_API_HOST: https://icp-api.io
      ICP_BACKEND_CANISTER_ID: iwvrs-vyaaa-aaaac-qhffa-cai
      ICP_MINER_ID: ks7-lite-01
      ICP_POLL_INTERVAL_MS: 10000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_HASH_POWER_PRO_STRATUM_PORT}:5557"
    volumes:
      - "${APP_DATA_DIR}/data:/data"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5558/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
