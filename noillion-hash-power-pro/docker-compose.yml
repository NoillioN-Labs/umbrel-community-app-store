version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: noillion-hash-power-pro_server_1
      APP_PORT: 5558

  server:
    image: ghcr.io/noillion-labs/hash-power-pro:0.1.5@sha256:b642c31349f90fbf5fb1bca1c93f17e7471dd9bc68f9772d6396928eb19fae57
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    environment:
      STRATUM_LISTEN_HOST: 0.0.0.0
      STRATUM_LISTEN_PORT: 5557
      CONTROL_LISTEN_HOST: 0.0.0.0
      CONTROL_LISTEN_PORT: 5558
      CONTROL_TOKEN: "${APP_PASSWORD}"
      GATEWAY_IDENTITY_PATH: /data/gateway-identity.json
      OWNER_UPSTREAM_HOST: host.docker.internal
      OWNER_UPSTREAM_PORT: 5556
      RENTER_UPSTREAM_HOST: au.kaspa.herominers.com
      RENTER_UPSTREAM_PORT: 1208
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_HASH_POWER_PRO_STRATUM_PORT}:5557"
    volumes:
      - "${APP_DATA_DIR}/data:/data"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5558/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
