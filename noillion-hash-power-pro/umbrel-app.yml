releaseNotes: >-
  Enables the authorised supervised route-switching proof with a one-shot local
  approval gate. The Gateway remains on the Owner route until it observes a live
  rental and the Umbrel operator presses Arm rental for that exact rental ID.
  Approval cannot transfer to a later rental and is cleared after activation or
  failure. Existing Gateway identity data remains private and persists across upgrades.

