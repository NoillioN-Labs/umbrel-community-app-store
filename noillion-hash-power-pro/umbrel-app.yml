description: >-
  Development proof of control for the Hash Power Pro ASIC rental gateway.
  The app keeps the miner on a fixed LAN Stratum endpoint, routes to the
  owner's Kaspa solo service by default, and permits a time-limited test route
  to an approved public pool. It is not yet a commercial rental service.
