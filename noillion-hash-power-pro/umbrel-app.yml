releaseNotes: >-
  Adds the authenticated ICP lease claim and acknowledgement runtime, exact-expiry
  route safety, and automatic Owner restoration after cancellation or expiry.
  The Gateway now observes the mainnet control plane, while physical enforcement
  remains disabled until the supervised route-switching proof is explicitly armed.
  Existing Gateway identity data remains private and persists across upgrades.

